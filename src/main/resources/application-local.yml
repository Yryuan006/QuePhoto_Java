spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/quephoto_dev?connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

oss:
  base-url: ${OSS_BASE_URL:https://images.example.invalid}

admin:
  username: ${ADMIN_USERNAME}
  password-hash: ${ADMIN_PASSWORD_HASH}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:quephoto}
  audience: ${JWT_AUDIENCE:quephoto-admin}